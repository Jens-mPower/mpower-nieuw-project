[project]
name = "mpower-gsc-mcp"
version = "0.1.0"
description = "MCP-server voor Google Search Console met een klantenlijst uit Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpower-gsc-mcp = "mpower_gsc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpower_gsc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
