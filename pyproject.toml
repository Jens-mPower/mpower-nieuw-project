[project]
name = "mpower-gsc-mcp"
version = "1.0.0"
description = "Google Search Console MCP-server voor mPower Digital, gebaseerd op AminForou/mcp-gsc"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Gelijk aan upstream (AminForou/mcp-gsc 0.4.1)
    "google-api-python-client>=2.163.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "mcp[cli]>=1.3.0,<2.0.0",
    "platformdirs>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mpower-gsc = "mpower_gsc:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gsc_server", "mpower_gsc"]
